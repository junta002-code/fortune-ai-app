<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直感＆本格トリプル占い</title>
  <style>
    body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;max-width:560px;margin:0 auto;padding:32px 20px;background:#f7f5fc;color:#25233a}
    .card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
    h1{font-size:24px;text-align:center}
    p{line-height:1.7}
    button{width:100%;padding:15px;border:0;border-radius:12px;background:#6554c7;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    #result{margin-top:20px;padding:15px;border-radius:12px;background:#f3f0fb;white-space:pre-wrap;display:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>🔮 直感＆本格トリプル占い</h1>
    <p>まずは、VercelからGemini AIへ正常に接続できることだけを確認します。</p>
    <button id="test">Gemini接続テスト</button>
    <div id="result"></div>
  </div>
<script>
document.getElementById("test").addEventListener("click", async () => {
  const result=document.getElementById("result");
  result.style.display="block";
  result.textContent="Geminiに接続しています…";
  try{
    const response=await fetch("/api/gemini-test");
    const data=await response.json().catch(()=>({}));
    result.textContent=data.message || data.error || "応答を受け取りました。";
  }catch(error){
    result.textContent="通信エラー: "+error.message;
  }
});
</script>
</body>
</html>
