<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6b57c9">
  <title>AIトリプル占い</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;
      background:linear-gradient(180deg,#f6f3ff 0%,#fbfafc 100%);
      color:#28243b;
    }
    .wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
    .card{
      background:#fff;
      border-radius:22px;
      padding:22px 20px 24px;
      box-shadow:0 8px 28px rgba(45,35,85,.10);
    }
    h1{
      margin:0;
      text-align:center;
      font-size:27px;
      letter-spacing:.02em;
    }
    .date{
      margin:8px 0 4px;
      text-align:center;
      font-size:15px;
      font-weight:700;
      color:#6b57c9;
    }
    .lead{
      margin:10px 0 20px;
      text-align:center;
      line-height:1.65;
      font-size:14px;
      color:#5b566b;
    }
    .field{margin-top:14px}
    label{
      display:block;
      margin-bottom:7px;
      font-size:14px;
      font-weight:700;
    }
    .select-row{display:flex;align-items:center;gap:10px}
    select{
      flex:1;
      min-width:0;
      appearance:auto;
      padding:13px 12px;
      border:1px solid #d9d4e8;
      border-radius:12px;
      background:#fff;
      color:#28243b;
      font-size:16px;
    }
    .fortune-button{
      width:100%;
      margin-top:22px;
      padding:15px;
      border:0;
      border-radius:13px;
      background:#6b57c9;
      color:#fff;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }
    .fortune-button:disabled{
      background:#bdb7d0;
      cursor:default;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>🔮 AIトリプル占い</h1>
      <div class="date" id="today"></div>
      <p class="lead">星座・血液型・直感マークの3つから、今日のあなたを占います。</p>

      <div class="field">
        <label for="zodiac">星座</label>
        <div class="select-row">
          <select id="zodiac">
            <option value="">選んでください</option>
            <option>おひつじ座</option>
            <option>おうし座</option>
            <option>ふたご座</option>
            <option>かに座</option>
            <option>しし座</option>
            <option>おとめ座</option>
            <option>てんびん座</option>
            <option>さそり座</option>
            <option>いて座</option>
            <option>やぎ座</option>
            <option>みずがめ座</option>
            <option>うお座</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="blood">血液型</label>
        <div class="select-row">
          <select id="blood">
            <option value="">選んでください</option>
            <option>A型</option>
            <option>B型</option>
            <option>O型</option>
            <option>AB型</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="mark">直感マーク</label>
        <div class="select-row">
          <select id="mark">
            <option value="">選んでください</option>
            <option value="spade">♠ スペード</option>
            <option value="diamond">♦ ダイヤ</option>
            <option value="heart">♥ ハート</option>
            <option value="club">♣ クラブ</option>
            <option value="star">★ スター</option>
          </select>
        </div>
      </div>

      <button class="fortune-button" id="fortuneButton" disabled>占ってみる</button>
    </section>
  </main>

<script>
  const today = new Date();
  const weekdays = ["日","月","火","水","木","金","土"];
  document.getElementById("today").textContent =
    today.getFullYear() + "年" +
    (today.getMonth()+1) + "月" +
    today.getDate() + "日（" +
    weekdays[today.getDay()] + "）";
</script>
</body>
</html>
