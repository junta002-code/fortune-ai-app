<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17142B">
  <title>AIトリプル占い</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:linear-gradient(160deg,#17142B 0%,#211938 48%,#30214A 100%);color:#28243b;min-height:100vh}
    .wrap{max-width:440px;margin:0 auto;padding:20px 16px 32px}
    .card{background:#fffdfb;border-radius:22px;padding:22px 20px 24px;box-shadow:0 12px 38px rgba(0,0,0,.28)}
    h1{margin:0;text-align:center;font-size:27px;letter-spacing:.02em}
    .date{margin:8px 0 4px;text-align:center;font-size:15px;font-weight:700;color:#6b57c9}
    .lead{margin:10px 0 6px;text-align:center;line-height:1.4;font-size:13px;white-space:nowrap;color:#5b566b}
    .field{margin-top:14px}
    label{display:block;margin-bottom:7px;font-size:14px;font-weight:700}
    .select-row{display:flex;align-items:center;gap:10px}
    select{flex:1;min-width:0;appearance:auto;padding:13px 12px;border:1px solid #d9d4e8;border-radius:12px;background:#fff;color:#28243b;font-size:16px}
    .mark-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .mark-button{height:58px;border:1px solid #d9d4e8;border-radius:14px;background:#fff;font-size:34px;font-weight:800;line-height:1;cursor:pointer;transition:.15s}
    .mark-button.selected{border:3px solid #6b57c9;box-shadow:0 0 0 3px rgba(107,87,201,.12);transform:translateY(-1px)}
    .mark-spade{color:#171717}.mark-diamond{color:#2f68d8}.mark-heart{color:#df3c4f}.mark-club{color:#2f9b5a}.mark-star{color:#e39a18}
    .fortune-button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:13px;background:#6b57c9;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
    .fortune-button:disabled{background:#bdb7d0;cursor:default}
    .loading{display:none;margin-top:20px;text-align:center;color:#6b57c9;font-weight:700}
    .result{display:none;margin-top:22px;padding-top:18px;border-top:1px solid #e5e0eb}
    .result h2{margin:0 0 14px;text-align:center;font-size:20px}
    .result p{margin:10px 0;line-height:1.7}
    .result-label{display:block;font-weight:800;margin-bottom:4px}
    .result-text{display:block}
    .lucky-answer{padding-left:20px}
    .score{text-align:center;font-size:28px;font-weight:800;color:#6b57c9;margin-top:16px}
    .error{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#fff0f0;color:#a33;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>🔮 AIトリプル占い</h1>
      <div class="date" id="today"></div>
      <p class="lead">星座・血液型・直感マークで占います。</p>

      <div class="field">
        <label for="zodiac">星座</label>
        <div class="select-row">
          <select id="zodiac">
            <option value="">選んでください</option>
            <option>おひつじ座</option><option>おうし座</option><option>ふたご座</option><option>かに座</option>
            <option>しし座</option><option>おとめ座</option><option>てんびん座</option><option>さそり座</option>
            <option>いて座</option><option>やぎ座</option><option>みずがめ座</option><option>うお座</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="blood">血液型</label>
        <div class="select-row">
          <select id="blood">
            <option value="">選んでください</option>
            <option>A型</option><option>B型</option><option>O型</option><option>AB型</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="mark">直感マーク</label>
        <div class="mark-grid" id="markGrid" role="group" aria-label="直感マーク">
          <button type="button" class="mark-button mark-spade" data-value="spade" aria-label="♠">♠</button>
          <button type="button" class="mark-button mark-diamond" data-value="diamond" aria-label="♦">♦</button>
          <button type="button" class="mark-button mark-heart" data-value="heart" aria-label="♥">♥</button>
          <button type="button" class="mark-button mark-club" data-value="club" aria-label="♣">♣</button>
          <button type="button" class="mark-button mark-star" data-value="star" aria-label="★">★</button>
        </div>
        <input type="hidden" id="mark" value="">
      </div>

      <button class="fortune-button" id="fortuneButton" disabled>占ってみる</button>
      <div class="loading" id="loading">🔮 AI占い中……</div>
      <div class="error" id="error"></div>

      <div class="result" id="result">
        <h2>今日のあなた</h2>
        <p id="zodiacResult"></p>
        <p><span class="result-label">【ラッキーカラー】</span><span class="result-text lucky-answer" id="luckyColor"></span></p>
        <p><span class="result-label">【ラッキーアイテム】</span><span class="result-text lucky-answer" id="luckyItem"></span></p>
        <div class="score" id="totalScore"></div>
      </div>
    </section>
  </main>

<script>
  const today = new Date();
  const weekdays = ["日","月","火","水","木","金","土"];
  document.getElementById("today").textContent =
    today.getFullYear()+"年"+(today.getMonth()+1)+"月"+today.getDate()+"日（"+weekdays[today.getDay()]+"）";

  const zodiac = document.getElementById("zodiac");
  const blood = document.getElementById("blood");
  const mark = document.getElementById("mark");
  const markButtons = [...document.querySelectorAll(".mark-button")];
  const button = document.getElementById("fortuneButton");
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const errorBox = document.getElementById("error");

  function updateButton(){
    button.disabled = !(zodiac.value && blood.value && mark.value);
  }

  [zodiac,blood].forEach(el => el.addEventListener("change", updateButton));

  markButtons.forEach(el => {
    el.addEventListener("click", () => {
      markButtons.forEach(btn => btn.classList.remove("selected"));
      el.classList.add("selected");
      mark.value = el.dataset.value;
      updateButton();
    });
  });

  button.addEventListener("click", async () => {
    button.disabled = true;
    loading.style.display = "block";
    loading.textContent = "🔮 AI占い中……";
    result.style.display = "none";
    errorBox.style.display = "none";

    const stageTimer1 = setTimeout(() => {
      loading.textContent = "🔮 もう少しお待ちください…";
    }, 2000);
    const stageTimer2 = setTimeout(() => {
      loading.textContent = "🔮 ただいま最終確認中…";
    }, 7000);

    try {
      const response = await fetch("/api/fortune", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          zodiac:zodiac.value,
          bloodType:blood.value,
          mark:mark.value
        })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        if (data.prepayCreditDepleted) {
          throw new Error("AI占いの利用上限に達しました。\nクレジットを追加すると再開できます。");
        }
        if (data.dailyFreeTierQuotaExceeded) {
          throw new Error("本日のAI占い上限に達しました。\nまた明日トライしてみてください！🙇");
        }
        if (data.geminiStatus === 503) {
          throw new Error("只今占い混雑中…\nしばらくしてからリトライしてください！");
        }
        throw new Error(data.error || "占い結果を取得できませんでした。しばらくしてからもう一度お試しください。");
      }

      const fortune = data.fortune || {};
      document.getElementById("zodiacResult").innerHTML = fortune.zodiacFortune ? '<span class="result-label">【運勢】</span><span class="result-text"></span>' : "";
      if (fortune.zodiacFortune) {
        document.getElementById("zodiacResult").querySelector(".result-text").textContent = fortune.zodiacFortune;
      }
      document.getElementById("luckyColor").textContent = fortune.luckyColor || "";
      document.getElementById("luckyItem").textContent = fortune.luckyItem || "";
      document.getElementById("totalScore").innerHTML = '<span class="result-label">【総合運点】</span><span class="result-text">' + (Number.isInteger(fortune.totalScore) ? fortune.totalScore : "—") + "点</span>";
      result.style.display = "block";
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.style.display = "block";
    } finally {
      clearTimeout(stageTimer1);
      clearTimeout(stageTimer2);
      loading.style.display = "none";
      updateButton();
    }
  });
</script>
</body>
</html>
